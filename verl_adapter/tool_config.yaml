tools:
- class_name: verl_adapter.rollout_worker.RealHookRoutedTool
  config:
    type: native
    tool_name: Bash
  tool_schema:
    type: function
    function:
      name: Bash
      description: Execute a shell command. Read-only observability commands (kubectl
        get/describe/top/logs, docker ps/stats/inspect/logs, curl GET, git log/show/diff/blame,
        rg/grep/cat/ls) are unrestricted. Low-risk remediation commands are auto-executed
        ONLY if they match the AIops-agent remediation.py whitelist AND target an
        authorized instance — every other command (including a whitelisted action
        against an unauthorized target) is denied by the real PreToolUse hook before
        it ever runs.
      parameters:
        type: object
        properties:
          command:
            type: string
            description: The shell command to run.
        required:
        - command
      strict: false
- class_name: verl_adapter.rollout_worker.RealHookRoutedTool
  config:
    type: native
    tool_name: Read
  tool_schema:
    type: function
    function:
      name: Read
      description: Read a file from the local filesystem (read-only).
      parameters:
        type: object
        properties:
          file_path:
            type: string
            description: Absolute path to the file to read.
        required:
        - file_path
      strict: false
- class_name: verl_adapter.rollout_worker.RealHookRoutedTool
  config:
    type: native
    tool_name: Grep
  tool_schema:
    type: function
    function:
      name: Grep
      description: Search file contents with a regex pattern (read-only).
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: Regex pattern to search for.
          path:
            type: string
            description: File or directory to search (optional).
        required:
        - pattern
      strict: false
- class_name: verl_adapter.rollout_worker.RealHookRoutedTool
  config:
    type: native
    tool_name: Glob
  tool_schema:
    type: function
    function:
      name: Glob
      description: Find files matching a glob pattern (read-only).
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: Glob pattern, e.g. '**/*.py'.
        required:
        - pattern
      strict: false
- class_name: verl_adapter.rollout_worker.RealHookRoutedTool
  config:
    type: native
    tool_name: mcp__aiops_rag__search_past_incidents
  tool_schema:
    type: function
    function:
      name: mcp__aiops_rag__search_past_incidents
      description: 语义检索历史相似的诊断工单（根因/处置经验）。当你想参考过去是否处理过类似故障、或想借鉴历史根因与处置方式时调用。传入描述当前故障的自然语言查询（如告警症状、可疑服务、现象），返回最相似的若干历史工单摘要。
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 描述当前故障的自然语言查询。
          top_k:
            type: integer
            description: 返回的历史工单条数。
        required:
        - query
      strict: false
